<div class="fondo-2">

  <div class="container-fluid margenes animate__animated animate__backInLeft">
    <br>

    <h3 class="pb-3 mb-4 border-bottom">Fast Music</h3>

    <div class="row g-3">

      <div class="col-12 col-sm-6 col-lg-3" *ngFor="let cancion of canciones; let i = index">

        <div class="card cancion-card h-100">

          <div class="card-body d-flex flex-column">

            <img
              class="portada"
              [src]="cancion.portada"
              [alt]="cancion.titulo"
            >

            <p class="cancion-nombre flex-grow-1">
              {{ cancion.titulo }}
            </p>

            <p class="cancion-artista">
              {{ cancion.artista }}
            </p>

            <button
              class="btn btn-dark btn-sm mt-auto"
              type="button"
              data-bs-toggle="collapse"
              [attr.data-bs-target]="'#spotify' + i"
              aria-expanded="false"
              [attr.aria-controls]="'spotify' + i"
            >
              ▶ Escuchar
            </button>

            <div style="min-height: 50px;">
              <div
                class="collapse mt-3"
                [id]="'spotify' + i"
              >
                <iframe data-testid="embed-iframe" style="border-radius:12px"
                        src="https://open.spotify.com/embed/playlist/5cSTyzwRIVjttDjc5o5aOn?utm_source=generator&si=6e2d480fdb174553"
                        width="100%" height="352" frameBorder="0" allowfullscreen=""
                        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                        loading="lazy"></iframe>
              </div>
            </div>

          </div>

        </div>

      </div>

    </div>

  </div>
</div>
