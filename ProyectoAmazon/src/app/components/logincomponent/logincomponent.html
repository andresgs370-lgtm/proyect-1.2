<div class="container-fluid margenes">
  <div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 80vh;">

    <img src="fast.png" alt="fast logo" style="width: 180px; margin-bottom: 30px;" class="animate__animated animate__backInLeft">

    <div class="card p-4 animate__animated animate__backInLeft" style="width: 100%; max-width: 400px;">
      <h3 class="text-center mb-4">Iniciar sesión</h3>

      <form>
        <div class="mb-3">
          <label for="correo" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" [(ngModel)]="correo" name="correo" id="correo" placeholder="ejemplo@correo.com">
        </div>

        <div class="mb-3">
          <label for="contrasena" class="form-label">Contraseña</label>
          <input type="password" class="form-control" [(ngModel)]="contrasena" name="contrasena" id="contrasena" placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-dark w-100 mb-2" (click)="condicionaLogin()">Iniciar sesión</button>
        <button type="button" class="btn btn-outline-dark w-100">Crear cuenta</button>
      </form>
      <p class="text-danger" *ngIf="msg">{{ msg }}</p>
    </div>

  </div>
</div>
